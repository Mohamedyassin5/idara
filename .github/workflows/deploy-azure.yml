name: Deploy backend to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: idara-tunisie   # name of the App Service (Code, Python 3.12, Linux)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Azure installs requirements.txt on the server (Oryx) when SCM_DO_BUILD_DURING_DEPLOYMENT=true
      - name: Package backend
        run: |
          zip -r app.zip . \
            -x ".git/*" ".github/*" ".venv/*" "frontend/*" "tmp/*" "docs/*" ".idea/*" \
               "*__pycache__*" "*.egg-info/*" ".env" "db/sessions.db*"

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
